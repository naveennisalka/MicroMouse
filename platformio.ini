; ═══════════════════════════════════════════════════════════════
;  MicroMouse — PlatformIO Project Config
;
;  Flash firmware:   pio run --target upload
;  Flash dashboard:  pio run --target uploadfs
;  Serial monitor:   pio device monitor
; ═══════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Libraries ──────────────────────────────────────────────────
lib_deps =
    ; Async web server — mathieucarbou fork bundles its own Async TCP
    mathieucarbou/ESP Async WebServer @ ^3.0.6
    ; VL53L0X Time-of-Flight sensors (Adafruit_BusIO pulled in transitively)
    adafruit/Adafruit_VL53L0X @ ^1.2.0

lib_ignore =
    ; Exclude the conflicting AsyncTCP variants and RP2040W port
    AsyncTCP_RP2040W
    AsyncTCP

; ── Filesystem ─────────────────────────────────────────────────
; The data/ folder is uploaded separately with: pio run --target uploadfs
board_build.filesystem = littlefs

; ── Build flags ────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0   ; Suppress verbose ESP-IDF logs
    -O2                    ; Optimise for speed
